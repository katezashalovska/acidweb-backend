server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: acidweb-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acidweb_db}${DB_SSLMODE:?sslmode=prefer}}
    username: ${DB_USER:aciduser}
    password: ${DB_PASS:acidpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

acidsoft:
  jwt:
    secret: ${ACIDSOFT_JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    expiration-ms: 86400000 # 24 hours
  admin:
    username: ${ACIDSOFT_ADMIN_USERNAME:}
    password: ${ACIDSOFT_ADMIN_PASSWORD:}
    email: ${ACIDSOFT_ADMIN_EMAIL:}

