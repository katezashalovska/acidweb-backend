version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acidweb_postgres
    environment:
      POSTGRES_DB: acidweb_db
      POSTGRES_USER: aciduser
      POSTGRES_PASSWORD: acidpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aciduser -d acidweb_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acidweb_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: acidweb_db
      DB_USER: aciduser
      DB_PASS: acidpass
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
